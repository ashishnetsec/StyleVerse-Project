<!DOCTYPE html>
<html lang="en">

<head>
    <title>StyleVerse</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Momo+Trust+Sans:wght@200..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>

    <nav>
        <div class="navbar">
            <div class="logo"><img src="./images/download.png" alt=""></div>
            <div class="action-btn">
                <div><a href="index.html">HOME</a></div>
                <div><a href="">WOMEN'S</a></div>
                <div><a href="">MEN'S</a></div>
                <div><a href="">SHOP</a></div>
                <div><a href="">PAGES</a></div>
                <div><a href="">BLOG</a></div>
                <div><a href="">CONTACT</a></div>
            </div>
            <div class="header-right">
                <div class="hr-reg">Login/Register</div>
                <div class="hr-icons">
                    <span><i class="fa-solid fa-magnifying-glass"></i></span>
                    <i class="fa-regular fa-heart"></i>
                    <i class="fa-solid fa-bag-shopping"></i>
                </div>
            </div>

            <div class="search-box-container">
                <div class="search-box">
                    <input type="text" class="search-input">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </div>
            </div>

            <div class="login-form">
                 <span>Login</span>
                <form>
                    <div class="form-email">
                        <h2 class="fe-txt">Enter Your Gmail</h2>
                        <input type="email" placeholder="Enter Your Email">
                    </div>
                    <div class="form-password">
                        <h2 class="fp-txt">Enter Your Password</h2>
                        <input type="text" placeholder="Enter Your Password">
                    </div>
                    <div class="signin-btn">Sign-In</div>
                </form>
            </div>
        </div>
    </nav>



    <script src="app.js"></script>
</body>

</html>
